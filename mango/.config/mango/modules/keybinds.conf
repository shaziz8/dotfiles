# makes mod variable equal super
var=mod,SUPER

# exit
bind=${mod},m,quit
bind=${mod},q,killclient,

# menu and terminal
bind=${mod},d,spawn,sh -c "pkill -x fuzzel || exec fuzzel"
bind=${mod},t,spawn,foot

# reload config
bind=${mod},r,reload_config

# custom keybinds
bind=${mod},z,spawn,librewolf
bind=${mod}+SHIFT,z,spawn,firefox
bind=${mod},h,spawn,prismlauncher
bind=${mod}+SHIFT,h,spawn,heroic
bind=${mod}+CTRL,h,spawn,flatpak run com.valvesoftware.Steam
bind=${mod},x,spawn,emacsclient -c -a emacs
bind=${mod}+SHIFT,x,spawn,zeditor

bind=NONE,Print,spawn,dms screenshot
# switch layout
bind=${mod},n,switch_layout

# moving around tags
bind=${mod},1,view,1,0
bind=${mod},2,view,2,0
bind=${mod},3,view,3,0
bind=${mod},4,view,4,0
bind=${mod},5,view,5,0
bind=${mod},6,view,6,0
bind=${mod},7,view,7,0
bind=${mod},8,view,8,0
bind=${mod},9,view,9,0

# Mouse Button Bindings
mousebind=${mod},btn_left,moveresize,curmove
# mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=${mod},btn_right,moveresize,curresize

# move window to different tag
bind=${mod}+SHIFT,1,tag,1,0
bind=${mod}+SHIFT,2,tag,2,0
bind=${mod}+SHIFT,3,tag,3,0
bind=${mod}+SHIFT,4,tag,4,0
bind=${mod}+SHIFT,5,tag,5,0
bind=${mod}+SHIFT,6,tag,6,0
bind=${mod}+SHIFT,7,tag,7,0
bind=${mod}+SHIFT,8,tag,8,0
bind=${mod}+SHIFT,9,tag,9,0

# gaps toggle
bind=ALT+SHIFT,R,togglegaps

# tag switch
bind=${mod},Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=${mod},Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+${mod},Left,tagtoleft,0
bind=CTRL+${mod},Right,tagtoright,0

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Brightness keys
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl s +5%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 5%-

# Volume keys
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=SHIFT,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle
